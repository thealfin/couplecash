services:
  postgres:
    image: postgres:15-alpine
    container_name: couplecash_postgres
    restart: always
    environment:
      POSTGRES_DB: couplecash
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d couplecash"]
      interval: 5s
      timeout: 5s
      retries: 5

  nocodb:
    image: nocodb/nocodb:latest
    container_name: couplecash_nocodb
    restart: always
    ports:
      - "8080:8080"
    environment:
      NC_DB: "pg://postgres:5432?u=postgres&p=secretpassword&d=nocodb"
      NC_ALLOW_LOCAL_EXTERNAL_DBS: "true"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
